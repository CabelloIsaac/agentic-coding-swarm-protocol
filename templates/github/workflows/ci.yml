  #   runs-on: ubuntu-latest
  #   timeout-minutes: 20
  #   steps:
  #     - uses: actions/checkout@v4
  #       with:
  #         persist-credentials: false
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 24
  #     - run: corepack enable && pnpm install --frozen-lockfile
