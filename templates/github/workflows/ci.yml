# CI: the same steps as `pnpm verify`, without secrets, in mock mode, plus optional extra jobs (CI ⊇ verify).
# If a gate needs credentials to pass, the test is badly designed.
# Every job beyond `quality` must say, in its comment, why it is not in local verify (needs a service, Docker, minutes).
# No step in the gate path may use `continue-on-error`: a gate that cannot fail is not a gate.
# Pin actions: keep `@vN` while adapting; before adopting, replace each tag with its full commit SHA, e.g.
#   gh api repos/actions/checkout/git/ref/tags/v4.2.2 --jq .object.sha   (and let Dependabot bump them).
# Tags are mutable, SHAs are not.
# pnpm comes from corepack, not a third-party action.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && pnpm install --frozen-lockfile
      # Prefer `pnpm verify` as one step; if you list its steps instead, keep them identical to verify.full
      - run: pnpm lint
      # Formatter (verify step `format`) and dependency gate (verify step `deps`, needs the network): the same commands as
      # `config.format.check` and `config.deps.command`/`deps-audit.ts` in scripts/dev/dev-flow.config.ts
      - run: pnpm biome format .
      - run: node scripts/dev/deps-audit.ts
      - run: pnpm typecheck
      # Domain contract validators: the project's own data files checked against their schemas
      - run: pnpm validate:registry
      - run: pnpm validate:config
      - run: pnpm exec openspec validate --all --no-interactive
      - run: pnpm test:coverage --maxWorkers=1
      # After the tests: the coverage ratchet reads the summary they write; also holds the silent-error ratchet
      - run: node scripts/dev/ratchets.ts
      - name: Memory diagnostics on failure
        if: failure() || cancelled()
        run: |
          free -m || true
          ps aux --sort=-rss | head -15 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  # Secret scan: the mechanism behind "never commit secrets" in CLAUDE.md (the settings.json deny rules only stop the
  # agent from reading .env files). Scans the full history of the push or pull request. It runs the gitleaks CLI from
  # a fixed release with a verified checksum instead of the third-party action: no token, no license key, no secret
  # reaches code this repo does not control. To upgrade: pick a release on github.com/gitleaks/gitleaks/releases,
  # copy the linux_x64 line from its checksums file, and update the two values below.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (fixed release, checksum verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -eu
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz
      - name: Scan history for secrets
        run: gitleaks git --redact --no-banner --exit-code 1 .

  # ---------------------------------------------------------------------------------------------------------------
  # Optional extra jobs. Uncomment the ones that apply. Each runs something local verify cannot run cheaply; make it
  # a required check on the integration branch (branch protection), or it is advice, not a gate.
  # ---------------------------------------------------------------------------------------------------------------

  # Backend parity: if the app has two storage backends (files and a database, an in-memory fake and the real one),
  # the same contract suites run against the real backend on a service container, migrations are applied from zero,
  # and a deterministic end-to-end run is compared across backends (record count and hash per collection).
  # Not in local verify: it needs a database server, and agents in worktrees should not need one to iterate.
  # backend-parity:
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 30
  #   services:
  #     db:
  #       image: postgres:16
  #       env:
  #         POSTGRES_PASSWORD: ci
  #         POSTGRES_DB: app_test
  #       ports:
  #         - 5432:5432
  #       options: >-
  #         --health-cmd "pg_isready -U postgres -d app_test"
  #         --health-interval 5s
  #         --health-timeout 5s
  #         --health-retries 12
  #   env:
  #     TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/app_test
  #   steps:
  #     - uses: actions/checkout@v4
  #       with:
  #         persist-credentials: false
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 24
  #     - run: corepack enable && pnpm install --frozen-lockfile
