  #       run: pnpm db:migrate && pnpm db:status
  #     - name: Contract suites against the real backend
  #       run: pnpm test:contract
  #     - name: Same end-to-end run on both backends, same fingerprints
  #       run: pnpm storage:compare

  # Image without secrets: the deployable image builds and carries no `.env` or credentials.
  # Not in local verify: it needs Docker and minutes of build time; a broken Dockerfile is rare but must not reach main.
  # image:
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 30
  #   steps:
  #     - uses: actions/checkout@v4
  #       with:
  #         persist-credentials: false
  #     - run: docker build --build-arg BUILD_SHA=${{ github.sha }} -t app:ci .
  #     - name: The image contains no secrets
  #       run: docker run --rm --entrypoint test app:ci ! -f /app/.env

  # Backup and restore roundtrip: seed a deterministic dataset, back it up, restore into an empty temp location and
  # run the data validators on the result. A backup nobody has restored is not a backup.
  # Not in local verify: it is slow and exercises the same code paths on every run; once per push is enough.
  # Script sketch (scripts/backup-roundtrip.sh, `set -euo pipefail`, everything in mock mode and on copies):
  #   work="$(mktemp -d)"; trap 'rm -rf "$work"' EXIT
  #   root="$(pnpm -s app demo:run --json | jq -r .root)"
  #   archive="$(APP_ROOT="$root" pnpm -s app backup:create --out "$work/b" --json | jq -r .archive)"
  #   pnpm -s app backup:restore "$archive" --into "$work/restored"
  #   APP_ROOT="$work/restored" pnpm -s app validate
