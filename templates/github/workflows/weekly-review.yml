# Weekly quality review with Claude Code in CI (alternative to /schedule).
# Requires the ANTHROPIC_API_KEY secret and, before that, an approved company data policy.
#
# Residual risk, stated plainly: the sweep runs project commands (`pnpm install`, `pnpm audit:repo`) in the same job
# as the model, with ANTHROPIC_API_KEY in the environment of the `claude` step. Any script the repo runs there can
# read that key. The key is therefore attached to that one step only, and you should use a dedicated key with a spend
# cap set in the Anthropic console and rotate it monthly. Dependencies are installed in a step that has no key.
#
# Two jobs on purpose. The agent runs with a read-only token, no persisted git credentials and only read-only git
# subcommands; it can write nothing but the report. A second job, with no agent in it, turns the report artifact
# into a DRAFT PR. It never pushes to main. The PR is LLM-written content: a person must review it, and it must never
# be auto-merged (no auto-merge, no merge queue entry, no bot approval).
# Pin actions: keep `@vN` while adapting; before adopting, replace each tag with its full commit SHA, e.g.
#   gh api repos/actions/checkout/git/ref/tags/v4.2.2 --jq .object.sha   (and let Dependabot bump them).
# Tags are mutable, SHAs are not.
name: weekly-review
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:
permissions: {}
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: npm install -g @anthropic-ai/claude-code
      - name: Weekly sweep
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude --bare -p "$(cat templates/review/weekly-quality.md)" \
            --append-system-prompt "$(cat .claude/agents/quality-auditor.md)" \
            --allowedTools "Read,Grep,Glob,Bash(git log *),Bash(git diff *),Bash(git show *),Bash(git status *),Bash(git ls-files *),Bash(pnpm audit:repo *),Bash(pnpm audit --json *),Write(openspec/audits/*)" \
            --disallowedTools "Bash(git -c *),Bash(git config *),Bash(git push *),Bash(curl *),Bash(wget *)" \
            --permission-mode dontAsk --max-turns 80 --max-budget-usd 5 \
            --output-format json > review.json
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-review
          path: openspec/audits/
          if-no-files-found: error
  publish:
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: weekly-review
          path: openspec/audits/
      - name: PR with the report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout -b review/$(date +%F)
          git add openspec/audits/
          git -c user.name="review-bot" -c user.email="review-bot@users.noreply.github.com" commit -m "docs(audits): weekly review $(date +%F)" || exit 0
          git push origin HEAD
          gh pr create --draft --title "Weekly review $(date +%F)" --body "Report generated by the weekly sweep (LLM-written). Draft: a person must review it before anything in it is acted on. Never auto-merge."
