# Weekly quality review with Claude Code in CI (alternative to /schedule).
# Requires the ANTHROPIC_API_KEY secret and, before that, an approved company data policy.
#
# Two jobs on purpose. The agent runs with a read-only token, no persisted git credentials and only read-only git
# subcommands; it can write nothing but the report. A second job, with no agent in it, turns the report artifact
# into a PR. It never pushes to main.
# Pin every action to a full commit SHA in your repo (and let Dependabot bump them); tags are mutable.
name: weekly-review
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:
permissions: {}
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: npm install -g @anthropic-ai/claude-code
      - name: Weekly sweep
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude --bare -p "$(cat templates/review/weekly-quality.md)" \
            --append-system-prompt "$(cat .claude/agents/quality-auditor.md)" \
            --allowedTools "Read,Grep,Glob,Bash(git log *),Bash(git diff *),Bash(git show *),Bash(git status *),Bash(git ls-files *),Bash(pnpm audit:repo *),Bash(pnpm audit --json *),Write(openspec/audits/*)" \
            --disallowedTools "Bash(git -c *),Bash(git config *),Bash(git push *),Bash(curl *),Bash(wget *)" \
            --permission-mode dontAsk --max-turns 80 --max-budget-usd 5 \
            --output-format json > review.json
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-review
          path: openspec/audits/
          if-no-files-found: error
  publish:
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: weekly-review
          path: openspec/audits/
      - name: PR with the report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout -b review/$(date +%F)
          git add openspec/audits/
          git -c user.name="review-bot" -c user.email="review-bot@users.noreply.github.com" commit -m "docs(audits): weekly review $(date +%F)" || exit 0
          git push origin HEAD
          gh pr create --title "Weekly review $(date +%F)" --body "Report generated by the weekly sweep. Review it and decide on the proposed order."
